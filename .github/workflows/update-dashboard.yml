name: Atualizar Dashboard

on:
  push:
    paths:
      - "data/**"

# Permissões necessárias para deploy via GitHub Pages Actions
permissions:
  contents: write
  pages: write
  id-token: write

# Evitar deploys simultâneos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Normalizar nome do Excel
        run: |
          cd data
          for f in *.xlsx *.XLSX; do
            [ -f "$f" ] || continue
            [ "$f" = "Fluxo_de_recebimento.xlsx" ] && continue
            echo "Renomeando: $f -> Fluxo_de_recebimento.xlsx"
            mv "$f" "Fluxo_de_recebimento.xlsx"
          done
          ls -lh

      - name: Processar Excel e gerar HTML
        run: python process_data.py

      - name: Criar pasta de deploy
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Salvar index.html no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Auto-deploy: dados atualizados [skip ci]"
          git push
