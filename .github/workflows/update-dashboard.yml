name: Atualizar Dashboard

on:
  push:
    paths:
      - "data/**"

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Normalizar nome do Excel
        run: |
          cd data
          for f in *.xlsx *.XLSX; do
            [ -f "$f" ] || continue
            [ "$f" = "Fluxo_de_recebimento.xlsx" ] && continue
            echo "Renomeando: $f -> Fluxo_de_recebimento.xlsx"
            mv "$f" "Fluxo_de_recebimento.xlsx"
          done

      - name: Processar Excel e gerar index.html
        run: python process_data.py

      - name: Publicar index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "chore: dashboard atualizado [skip ci]"
          git push
